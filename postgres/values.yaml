settings:
  existingSecret: postgres-credentials
  superuserPassword:
    secretKey: adminPassword

storage:
  requestedSize: 10Gi
  className: local-path

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

extraEnvSecrets:
  - postgres-credentials

customScripts:
  init.sh: |
    #!/bin/bash
    set -e

    psql -v ON_ERROR_STOP=1 --username postgres <<-EOSQL
        DO \$\$
        BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'authentik') THEN
                CREATE USER authentik WITH PASSWORD '${authentikPassword}';
            END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'vaultwarden') THEN
                CREATE USER vaultwarden WITH PASSWORD '${vaultwardenPassword}';
            END IF;
        END
        \$\$;
    EOSQL

    for db in authentik vaultwarden; do
        psql -v ON_ERROR_STOP=1 --username postgres -tc \
            "SELECT 1 FROM pg_database WHERE datname = '$db'" | grep -q 1 \
        || psql -v ON_ERROR_STOP=1 --username postgres -c "CREATE DATABASE $db OWNER $db"
    done
