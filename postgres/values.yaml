auth:
  existingSecret: postgres-credentials
  secretKeys:
    adminPasswordKey: adminPassword

persistence:
  enabled: true
  size: 10Gi
  storageClassName: local-path

primary:
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  initdb:
    databases:
      authentik: {}
      vaultwarden: {}
    users:
      - username: authentik
        password:
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: authentikPassword
        databases:
          - authentik
      - username: vaultwarden
        password:
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: vaultwardenPassword
        databases:
          - vaultwarden
